<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DOM Project</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
            }
            .sub-btn {
                color: white;
                padding: 10px 18px;
                background-color: black;
                font-weight: bolder;
                border: none;
                border-radius: 50px;
            }

            .subs {
                background-color: rgb(240, 239, 239);
                color: black;
            }

            .inp {
                padding: 10px;
            }

            .cal-btn {
                padding: 12px;
                border: none;
                background-color: rgb(15, 161, 15);
                color: white;
            }
        </style>
    </head>
    <body>
        <p>Youtube subscribe Button</p>
        <button class="sub-btn" onclick="sub()">Subscribe</button>

        <h3>Amazon Shipping Calculator</h3>

        <p>if Amount Less than 70rs then +10rs for Shipping</p>

        <p>if Amount More Than 70rs then Free Shipping</p>

        <input
            class="inp"
            type="text"
            placeholder="Enter Amount"
            onkeydown="enter(event)"
        />
        <button class="cal-btn" onclick="totalCost()">Calculate</button>
        <p class="cost"></p>

        <script>
            function sub() {
                let subBtn = document.querySelector(".sub-btn");

                if (subBtn.innerText === "Subscribe") {
                    subBtn.innerHTML = "Subscribed";
                    subBtn.classList.add("subs");
                } else {
                    subBtn.innerHTML = "Subscribe";
                    subBtn.classList.remove("subs");
                }
            }

            function totalCost() {
                const cost = Number(document.querySelector(".inp").value);

                if (cost < 70) {
                    document.querySelector(".cost").innerHTML =
                        `The Total Cost is : Rs.${cost + 10}`;
                } else {
                    document.querySelector(".cost").innerHTML =
                        `The Total Cost is : Rs.${cost}`;
                }
            }

            function enter(event) {
                if (event.key === "Enter") {
                    totalCost();
                }
            }
        </script>
    </body>
</html>
